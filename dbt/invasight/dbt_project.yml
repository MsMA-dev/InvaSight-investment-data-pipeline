name: 'invasight'
version: '1.0.0'
config-version: 2

profile: 'invasight'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  invasight:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    analytics:
      +materialized: table
      +schema: analytics
