name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Full pipeline on the sample data: land -> load DuckDB -> dbt build (models + tests)
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/run_local.py

  # Build the Airflow image and prove every DAG imports inside it
  airflow-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: airflow
          load: true
          tags: invasight-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: DAG import test
        run: |
          docker run --rm \
            -v "$PWD/airflow/dags:/opt/airflow/dags" \
            -v "$PWD/airflow/tests:/tests" \
            -e PYTHONPATH=/opt/airflow/dags \
            --entrypoint python \
            invasight-airflow:ci /tests/test_dag_integrity.py
