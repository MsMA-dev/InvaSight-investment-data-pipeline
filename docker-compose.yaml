services:
  airflow:
    build:
      context: ./airflow
    image: invasight-airflow:local
    env_file:
      - path: .env
        required: false
    environment:
      PIPELINE_MODE: ${PIPELINE_MODE:-local}
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-sample}
      DATA_DIR: /opt/airflow/data
      DUCKDB_PATH: /opt/airflow/data/warehouse/invasight.duckdb
      DBT_PROJECT_DIR: /opt/dbt/invasight
      DBT_PROFILES_DIR: /opt/dbt/invasight
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Local demo only: no login screen. Remove for anything shared.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./dbt:/opt/dbt
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    # The pool must exist before the first run: every load/dbt task uses it
    command: >
      bash -c "airflow db migrate &&
               airflow pools set warehouse_pool 1 'Single writer for the warehouse' &&
               exec airflow standalone"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
